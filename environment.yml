# Conda environment used for all paper results (Python 3.11, CUDA 12.4 wheels of torch 2.6).
# Create with: conda env create -f environment.yml && conda activate asymvlm && pip install -e .
name: asymvlm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel
  - pip:
      - accelerate==1.4.0
      - av==14.2.0
      - decord==0.6.0
      - einops==0.8.1
      - imageio==2.37.0
      - matplotlib==3.10.1
      - numpy==2.2.3
      - opencv-python-headless==4.11.0.86
      - openpyxl==3.1.5
      - pandas==2.2.3
      - pillow==11.1.0
      - huggingface-hub==0.36.2
      - safetensors==0.8.0
      - tokenizers==0.21.4
      - protobuf==6.33.6
      - pyarrow==19.0.1
      - portalocker==3.2.0
      - psutil==7.0.0
      - pytest==8.3.5
      - python-dotenv==1.0.1
      - qwen-vl-utils==0.0.10
      - rich==13.9.4
      - sentencepiece==0.2.0
      - sty==1.0.6
      - tabulate==0.9.0
      - torch==2.6.0
      - torchvision==0.21.0
      - tqdm==4.67.1
      - transformers==4.51.3
      - validators==0.35.0
      - XlsxWriter==3.2.2
